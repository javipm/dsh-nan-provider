name: publish

# Tag-driven release. A `v*` tag must equal package.json's version.
# Prefer npm trusted publishing (npmjs.com -> package -> Trusted Publisher,
# pointing at this repo + workflow); it needs no NPM_TOKEN secret.
#
# If the version is already on npm (published manually, or the tag re-pushed),
# the job reports it and succeeds instead of failing on "cannot publish over".
on:
  push:
    tags: ['v*']

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm test
      - name: tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: already published?
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-nan-provider@$version" version >/dev/null 2>&1; then
            echo "dsh-nan-provider@$version is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
