# dsh-nan-usage bundle patch: mount the plugin as a profile row.
#
# The plugin registers a sidebar panel (ctx.tuiPanels) and a /usage command
# when those services exist. Every config key below is optional; these are
# the defaults, repeated here so the profile shows what can be tuned.
#
# API key: the plugin uses its own credential ref, `NAN_API_KEY`, so a separate
# OpenAI provider can keep `OPENAI_API_KEY` for itself. When the ref is unset the
# value comes from the environment variable of the same name.
- insert:
    - id: nan
      name: 'dsh-nan-provider'
      config:
        apiKeyEnv: NAN_API_KEY
        baseUrl: https://api.nan.builders/v1
        windowDays: 30
        autoRefreshSeconds: 60
        commandName: nan-usage
        panelId: usage
        panelTitle: NaN usage
        lowCreditsPercent: 10
        footer: true
        provider: nan
        setupModel: deepseek-v4-flash
        setupEffort: max
